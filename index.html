<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f7fbff;min-height:100svh;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}main{max-width:720px;margin:auto}h1{font-size:clamp(28px,8vw,46px);line-height:1;margin:8px 0 8px}.sub{opacity:.8;margin:0 0 18px}.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.count{font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}button{appearance:none;border:0;border-radius:16px;padding:16px 14px;font-size:17px;font-weight:800;min-height:54px;cursor:pointer}#draw{background:#49dcb1;color:#03251b}#copy{background:#20324a;color:#fff}.results{list-style:none;padding:0;margin:0;display:grid;gap:10px}.result{display:flex;align-items:center;gap:14px;background:#111f31;border:1px solid #27405e;border-radius:17px;padding:15px 16px;min-height:62px}.num{font-variant-numeric:tabular-nums;opacity:.48;font-weight:900}.name{font-size:clamp(18px,5vw,25px);font-weight:900;word-break:break-word}.previous{margin:15px 2px 0;font-size:13px;opacity:.62;line-height:1.6;word-break:break-word}@media(max-width:440px){.actions{grid-template-columns:1fr}button{font-size:18px}.result{padding:14px}}
